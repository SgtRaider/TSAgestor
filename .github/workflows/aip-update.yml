name: AIP auto-update

# Refresca js/aipData.js a partir del eAIP de ENAIRE (HTML scrape).
# Cada AIRAC son 28 dias; ejecutamos cada jueves para coger el ciclo
# nuevo el dia que entra en vigor (los AIRAC empiezan los jueves).
# Tambien se puede disparar manualmente desde la pestana Actions.
on:
  schedule:
    - cron: '0 6 * * 4'      # cada jueves a las 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: data-sources/aip-enr/requirements.txt

      - name: Install deps
        run: pip install -r data-sources/aip-enr/requirements.txt

      - name: Scrape eAIP -> aip-data.json
        run: python data-sources/aip-enr/scrape_eaip.py

      - name: Embed -> js/aipData.js
        run: python data-sources/aip-enr/embed_aip.py

      - name: Bump Service Worker cache version
        # Asegura que los clientes PWA reciben el aipData.js nuevo sin
        # tener que pulsar Ctrl+Shift+R. Encontramos la version actual
        # tsagestor-vNN y la incrementamos.
        run: |
          python - <<'PY'
          import re, pathlib
          sw = pathlib.Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          m = re.search(r"CACHE_VERSION = 'tsagestor-v(\d+)'", t)
          if not m:
              raise SystemExit('No CACHE_VERSION found in sw.js')
          n = int(m.group(1)) + 1
          new = re.sub(r"CACHE_VERSION = 'tsagestor-v\d+'",
                       f"CACHE_VERSION = 'tsagestor-v{n}'", t)
          sw.write_text(new, encoding='utf-8', newline='\n')
          print(f"sw.js: tsagestor-v{m.group(1)} -> tsagestor-v{n}")
          PY

      - name: Detectar cambios y abrir PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/aip-update
          delete-branch: true
          commit-message: |
            chore(aip): refresh AIP data from eAIP ENAIRE
          title: 'chore(aip): refresh AIP data from eAIP ENAIRE'
          body: |
            Refresco automatico de aerovias / NAVAIDs / waypoints RNAV
            desde el eAIP de ENAIRE (`scrape_eaip.py`).

            - `data-sources/aip-enr/aip-data.json` regenerado.
            - `js/aipData.js` reembedido.
            - `sw.js` CACHE_VERSION incrementado para invalidar PWA.

            Revisa el AIRAC del JSON y los conteos de aerovias/waypoints
            antes de mergear: si el HTML del eAIP cambia de formato, el
            scraper podria producir un dataset vacio o incompleto y este
            PR lo dejaria visible para que no se mergee.
          add-paths: |
            data-sources/aip-enr/aip-data.json
            js/aipData.js
            sw.js
